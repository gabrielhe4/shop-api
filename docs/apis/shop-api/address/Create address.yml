info:
  name: Create address
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/user/addresses"
  body:
    type: json
    data: |2-
        {
          "street": "Calle Juárez",
          "buildingName": "Edificio Central",
          "city": "Guadalajara",
          "state": "Jalisco",
          "country": "Mexico",
          "zipcode": "44100"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
