info:
  name: Sign in
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/sign-in"
  headers:
    - name: springBoot
      value: ""
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "adminPass"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
