info:
  name: Add product to cart
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/cart/products"
  body:
    type: json
    data: |-
      {
        "productId": 1,
        "quantity" : 4
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
