info:
  name: Add product
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/admin/product"
  body:
    type: json
    data: |2-
        {
          "categoryId": 13,
          "name": "Wireless Printer",
          "description": "All-in-one wireless printer with scanning and copying capabilities.",
          "stock": 2,
          "price": 5.99,
          "discount": 10
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
