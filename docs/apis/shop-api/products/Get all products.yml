info:
  name: Get all products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/public/products?pageNumber=0&pageSize=10&sortBy=id&sortOrder=asc"
  params:
    - name: pageNumber
      value: "0"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: sortBy
      value: id
      type: query
    - name: sortOrder
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
